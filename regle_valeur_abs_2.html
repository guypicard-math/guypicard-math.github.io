<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activité - Règle de la fonction valeur absolue</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MathJax pour l'affichage des formules mathématiques -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['\\(', '\\)']],
                displayMath: [['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        .math-font { font-family: 'Cambria Math', 'Times New Roman', serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-8">

    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border-t-4 border-blue-600">
        
        <!-- En-tête -->
        <div class="bg-blue-50 p-6 sm:p-8 border-b border-blue-100">
            <h1 class="text-3xl font-bold text-blue-800 mb-2">Découvre la règle de la fonction valeur absolue</h1>
            <p class="text-slate-600 text-lg">Observe le graphique à gauche et détermine les paramètres de la règle \( f(x) = a|x - h| + k \).</p>
        </div>

        <!-- Contenu divisé Gauche (Graphique) / Droite (Saisie et Rétroaction) -->
        <div class="flex flex-col lg:flex-row p-6 sm:p-8 gap-8">
            
            <!-- Section Gauche : Graphique -->
            <div class="w-full lg:w-1/2 flex flex-col items-center">
                <div class="relative border-2 border-slate-200 rounded-lg shadow-sm bg-white p-2">
                    <canvas id="graphCanvas" width="400" height="400" class="w-full max-w-[400px] h-auto"></canvas>
                </div>
                <button onclick="genererNouveau()" class="mt-6 px-6 py-3 bg-slate-200 text-slate-700 font-bold rounded-lg hover:bg-slate-300 transition shadow">
                    Générer un nouveau graphique
                </button>
            </div>

            <!-- Section Droite : Contrôles et Rétroaction -->
            <div class="w-full lg:w-1/2 flex flex-col">
                
                <!-- Zone de saisie -->
                <div class="bg-slate-100 p-6 rounded-xl border border-slate-200 mb-6 shadow-inner">
                    <div class="text-2xl text-center mb-6 font-bold text-slate-700">
                        \( f(x) = a |x - h| + k \)
                    </div>
                    
                    <div class="flex flex-col gap-5 items-center">
                        <div class="flex items-center gap-4">
                            <label class="font-bold text-lg text-slate-700 w-32 text-right">Paramètre a :</label>
                            <input type="number" id="input-a" class="border-2 border-slate-300 p-2 rounded-lg w-24 text-center text-lg font-bold focus:border-blue-500 outline-none" step="0.5">
                        </div>
                        <div class="flex items-center gap-4">
                            <label class="font-bold text-lg text-slate-700 w-32 text-right">Paramètre h :</label>
                            <input type="number" id="input-h" class="border-2 border-slate-300 p-2 rounded-lg w-24 text-center text-lg font-bold focus:border-blue-500 outline-none" step="1">
                        </div>
                        <div class="flex items-center gap-4">
                            <label class="font-bold text-lg text-slate-700 w-32 text-right">Paramètre k :</label>
                            <input type="number" id="input-k" class="border-2 border-slate-300 p-2 rounded-lg w-24 text-center text-lg font-bold focus:border-blue-500 outline-none" step="1">
                        </div>
                    </div>
                    
                    <button onclick="valider()" class="mt-8 w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold rounded-lg shadow transition">
                        Vérifier ma réponse
                    </button>
                </div>

                <!-- Zone de Rétroaction (Feedback) -->
                <div id="feedback-box" class="hidden p-5 rounded-xl border-l-4 shadow-sm text-lg"></div>
            </div>
        </div>
    </div>

    <script>
        let params = { a: 1, h: 0, k: 0 };
        let erreurs = 0;
        
        // Dimensions et échelle du Canvas
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const scale = 20; // 20 pixels par unité
        const originX = width / 2;
        const originY = height / 2;

        function init() {
            genererNouveau();
        }

        function genererNouveau() {
            erreurs = 0;
            cacherFeedback();
            
            document.getElementById('input-a').value = '';
            document.getElementById('input-h').value = '';
            document.getElementById('input-k').value = '';

            // Génération de paramètres aléatoires
            params.h = Math.floor(Math.random() * 13) - 6; // Entre -6 et 6
            params.k = Math.floor(Math.random() * 13) - 6; // Entre -6 et 6
            
            const aPossibles = [-3, -2, -1, -0.5, 0.5, 1, 2, 3];
            params.a = aPossibles[Math.floor(Math.random() * aPossibles.length)];

            dessinerGraphique();
        }

        function dessinerGraphique() {
            ctx.clearRect(0, 0, width, height);

            // 1. Dessiner le quadrillage
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= width; i += scale) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(width, i); ctx.stroke();
            }

            // 2. Dessiner les axes X et Y
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, height); ctx.stroke(); // Axe Y
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(width, originY); ctx.stroke(); // Axe X

            // Graduations
            ctx.fillStyle = '#64748b';
            ctx.font = '10px Arial';
            for (let i = -10; i <= 10; i++) {
                if (i !== 0) {
                    ctx.fillText(i, originX + i * scale - 4, originY + 12);
                    ctx.fillText(-i, originX - 15, originY + i * scale + 4);
                }
            }

            // 3. Dessiner la fonction valeur absolue : f(x) = a|x - h| + k
            ctx.strokeStyle = '#2563eb'; // Bleu pour la fonction
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            // Calculer les points
            let startX = -10;
            let startY = params.a * Math.abs(startX - params.h) + params.k;
            ctx.moveTo(originX + startX * scale, originY - startY * scale);

            for (let x = -10; x <= 10; x += 0.1) {
                let y = params.a * Math.abs(x - params.h) + params.k;
                ctx.lineTo(originX + x * scale, originY - y * scale);
            }
            ctx.stroke();

            // 4. Mettre en évidence le sommet (h, k)
            ctx.fillStyle = '#dc2626'; // Rouge
            ctx.beginPath();
            ctx.arc(originX + params.h * scale, originY - params.k * scale, 5, 0, 2 * Math.PI);
            ctx.fill();

            // 5. Mettre en évidence un deuxième point (h + 1 ou h + 2 selon 'a' pour tomber juste)
            let deltaX = (params.a === 0.5 || params.a === -0.5) ? 2 : 1;
            let pt2X = params.h + deltaX;
            let pt2Y = params.a * Math.abs(pt2X - params.h) + params.k;

            // Si le 2e point est dans le graphique, on l'affiche
            if (pt2X >= -10 && pt2X <= 10 && pt2Y >= -10 && pt2Y <= 10) {
                ctx.fillStyle = '#16a34a'; // Vert
                ctx.beginPath();
                ctx.arc(originX + pt2X * scale, originY - pt2Y * scale, 5, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        function valider() {
            let saisieA = parseFloat(document.getElementById('input-a').value);
            let saisieH = parseFloat(document.getElementById('input-h').value);
            let saisieK = parseFloat(document.getElementById('input-k').value);
            
            let fb = document.getElementById('feedback-box');
            fb.classList.remove('hidden', 'bg-green-100', 'border-green-500', 'text-green-800', 'bg-yellow-100', 'border-yellow-500', 'text-yellow-800', 'bg-red-100', 'border-red-500', 'text-red-800');

            // Validation si tous les champs sont remplis
            if (isNaN(saisieA) || isNaN(saisieH) || isNaN(saisieK)) {
                fb.classList.add('bg-yellow-100', 'border-yellow-500', 'text-yellow-800');
                fb.innerHTML = "<strong>Attention :</strong> Assure-toi de remplir les trois paramètres (a, h, k).";
                return;
            }

            let hCorrect = (saisieH === params.h);
            let kCorrect = (saisieK === params.k);
            let aCorrect = (saisieA === params.a);

            if (hCorrect && kCorrect && aCorrect) {
                // SUCCÈS
                fb.classList.add('bg-green-100', 'border-green-500', 'text-green-800');
                fb.innerHTML = `<strong>Excellent !</strong> L'équation est bien <strong>f(x) = ${params.a}|x - ${params.h}| + ${params.k}</strong>.`;
                MathJax.typesetPromise([fb]);
            } else {
                // ERREUR
                erreurs++;
                
                if (erreurs === 1) {
                    fb.classList.add('bg-yellow-100', 'border-yellow-500', 'text-yellow-800');
                    if (!hCorrect || !kCorrect) {
                        fb.innerHTML = "<strong>Indice (Essai 1/3) :</strong> Vérifie les paramètres (h, k). Rappelle-toi qu'ils correspondent aux coordonnées du sommet du « V » (le point rouge).";
                    } else if (Math.sign(saisieA) !== Math.sign(params.a)) {
                        fb.innerHTML = "<strong>Indice (Essai 1/3) :</strong> Le sommet est bon, mais regarde bien l'orientation du « V » (vers le haut ou vers le bas) pour déterminer le signe du paramètre <em>a</em>.";
                    } else {
                        fb.innerHTML = "<strong>Indice (Essai 1/3) :</strong> Le sommet et l'orientation sont bons. Vérifie la valeur de l'ouverture (paramètre <em>a</em>).";
                    }
                } 
                else if (erreurs === 2) {
                    fb.classList.add('bg-yellow-100', 'border-yellow-500', 'text-yellow-800');
                    if (!hCorrect || !kCorrect) {
                        fb.innerHTML = `<strong>Indice (Essai 2/3) :</strong> Le sommet (h, k) semble être à la coordonnée (${params.h}, ${params.k}). Remplace bien h et k dans l'équation.`;
                    } else {
                        fb.innerHTML = "<strong>Indice (Essai 2/3) :</strong> Pour trouver le paramètre <em>a</em>, place-toi sur le sommet rouge. Avance vers la droite de 1 unité (Δx). De combien d'unités dois-tu monter ou descendre (Δy) pour retrouver la fonction sur le point vert ?";
                    }
                } 
                else {
                    fb.classList.add('bg-red-100', 'border-red-500', 'text-red-800');
                    
                    let deltaX = (params.a === 0.5 || params.a === -0.5) ? 2 : 1;
                    let deltaY = params.a * deltaX;
                    let directionA = params.a > 0 ? "vers le haut" : "vers le bas";
                    let signeA = params.a > 0 ? "positif" : "négatif";
                    
                    fb.innerHTML = `
                        <h3 class="font-bold mb-2">Explication complète :</h3>
                        <ol class="list-decimal list-inside space-y-2 mb-3">
                            <li><strong>Le sommet (h, k) :</strong> Le point rouge est situé à (${params.h}, ${params.k}). Donc, <strong>h = ${params.h}</strong> et <strong>k = ${params.k}</strong>.</li>
                            <li><strong>Le signe de <em>a</em> :</strong> La fonction est ouverte ${directionA}, le paramètre <em>a</em> est donc <strong>${signeA}</strong>.</li>
                            <li><strong>La valeur de <em>a</em> :</strong> À partir du sommet, si on se déplace de ${deltaX} unité(s) vers la droite (\(\\Delta x = ${deltaX}\)), on doit se déplacer de ${Math.abs(deltaY)} unités verticalement (\(\\Delta y = ${deltaY}\)) pour rejoindre le point vert.</li>
                            <li><strong>Calcul du taux de variation (a) :</strong> \( a = \\frac{\\Delta y}{\\Delta x} = \\frac{${deltaY}}{${deltaX}} = ${params.a} \).</li>
                        </ol>
                        <p>La règle est donc : <strong>f(x) = ${params.a}|x - ${params.h < 0 ? `(${params.h})` : params.h}| ${params.k >= 0 ? '+ '+params.k : params.k}</strong>.</p>
                        <p class="mt-3 font-semibold text-sm">Clique sur « Générer un nouveau graphique » pour réessayer !</p>
                    `;
                    MathJax.typesetPromise([fb]);
                }
            }
        }

        function cacherFeedback() {
            document.getElementById('feedback-box').classList.add('hidden');
        }

        // Initialisation au chargement de la page
        window.onload = init;
    </script>
</body>
</html>
